<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ฝึกซ้อมลูกไม้มวยไชยา ระดับต้น</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'Kanit', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 280px;
      margin-bottom: 36px;
    }
    .th-text {
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.2;
    }
    .phonetic-text {
      font-size: clamp(1.3rem, 3.8vw, 2.4rem);
      font-weight: 700;
      color: #ff3b30;
      letter-spacing: 1px;
      margin-bottom: 12px;
      line-height: 1.2;
      text-transform: uppercase;
    }
    .en-text {
      font-size: clamp(1.2rem, 3.4vw, 2.2rem);
      font-weight: 600;
      color: #38bdf8;
      line-height: 1.2;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    button {
      background-color: #1f2937;
      color: #f3f4f6;
      border: 1px solid #374151;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button:hover {
      background-color: #374151;
      border-color: #4b5563;
    }
    button.primary {
      background-color: #dc2626;
      border-color: #ef4444;
    }
    button.primary:hover {
      background-color: #b91c1c;
    }
    .settings {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 0.95rem;
      color: #9ca3af;
    }
    select {
      background-color: #111827;
      color: #f9fafb;
      border: 1px solid #374151;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .status-badge {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #6b7280;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="th-text" id="thaiDisplay">พร้อมฝึกซ้อม</div>
    <div class="phonetic-text" id="phoneticDisplay">READY</div>
    <div class="en-text" id="englishDisplay">Press Start to Begin</div>
  </div>

  <div class="controls">
    <button class="primary" id="btnToggle" onclick="toggleTraining()">เริ่มการฝึก (Start)</button>
    <button onclick="nextMove()">ท่าถัดไป (Next)</button>
    <button onclick="resetTraining()">เริ่มใหม่ (Reset)</button>
  </div>

  <div class="settings">
    <label for="intervalSelect">หน่วงเวลาต่อท่า:</label>
    <select id="intervalSelect" onchange="updateInterval()">
      <option value="2500">2.5 วินาที</option>
      <option value="3000" selected>3.0 วินาที</option>
      <option value="4000">4.0 วินาที</option>
      <option value="5000">5.0 วินาที</option>
    </select>
  </div>

  <div class="status-badge" id="stepCounter">ลำดับที่: 0 / 60</div>

  <script>
    // ชุดข้อมูลลำดับคำสั่งตามโครงสร้างวิดีโอลูกไม้ระดับต้น
    const playlist = [
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ห้ามทัพด้วยเข่า", pho: "HAHM-TUP DUAYKOW", en: "STOP THE ARMY With KNEE" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ห้ามทัพด้วยเข่า", pho: "HAHM-TUP DUAYKOW", en: "STOP THE ARMY With KNEE" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ห้ามทัพด้วยเข่าสลับเหลี่ยม", pho: "HAHM-TUP DUAYKOW S'LUB-LIEAM", en: "STOP THE ARMY With KNEE via Alternate Angles" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ห้ามทัพด้วยเข่าสลับเหลี่ยม", pho: "HAHM-TUP DUAYKOW S'LUB-LIEAM", en: "STOP THE ARMY With KNEE via Alternate Angles" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ปักลูกทอย", pho: "BPAHK_LOOG-TAWY", en: "Impale The Stake" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ปักลูกทอย", pho: "BPAHK_LOOG-TAWY", en: "Impale The Stake" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ปักษาแหวกรัง", pho: "BPUK-SAH_WAAG_RUNG", en: "Bird Peeps Into The Nest" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ปักษาแหวกรัง", pho: "BPUK-SAH_WAAG_RUNG", en: "Bird Peeps Into The Nest" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ห้ามทัพด้วยถีบ", pho: "HAHM_TUP-DUAY-TEEB", en: "Stop The Army With Push Kick" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ห้ามทัพด้วยถีบ", pho: "HAHM_TUP-DUAY-TEEB", en: "Stop The Army With Push Kick" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "สลับฟันปลา", pho: "S'LUB-FUN-BPLAH", en: "Zigzag" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "สลับฟันปลา", pho: "S'LUB-FUN-BPLAH", en: "Zigzag" },
      { th: "จดมวยเหลี่ยมซ้าย", pho: "JROD MUAY LIAM-SYE", en: "ASSUME LEFT GUARD" },
      { th: "ห้ามทัพด้วยฝ่ามือ", pho: "HAHM_TUP-DUAY_FAH-MEUX", en: "Stop The Army with Palm" },
      { th: "จดมวยเหลี่ยมขวา", pho: "JROD MUAY LIAM-KWAH", en: "ASSUME RIGHT GUARD" },
      { th: "ห้ามทัพด้วยฝ่ามือ", pho: "HAHM_TUP-DUAY_FAH-MEUX", en: "Stop The Army with Palm" }
    ];

    let currentIndex = -1;
    let timer = null;
    let isRunning = false;
    let stepDelay = 3000;

    // ระบบสังเคราะห์เสียงจำลอง TTS โทนกระชับ ชัดเจน
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'th-TH';
      utterance.rate = 1.0;  // ความเร็วปกติ ชัดถ้อยชัดคำ
      utterance.pitch = 0.9; // ปรับโทนทุ้มเล็กน้อยให้ใกล้เคียงเสียงต้นฉบับ

      const voices = window.speechSynthesis.getVoices();
      const thaiVoice = voices.find(v => v.lang.includes('th'));
      if (thaiVoice) utterance.voice = thaiVoice;

      window.speechSynthesis.speak(utterance);
    }

    function renderCurrentStep() {
      const item = playlist[currentIndex];
      document.getElementById('thaiDisplay').innerText = item.th;
      document.getElementById('phoneticDisplay').innerText = item.pho;
      document.getElementById('englishDisplay').innerText = item.en;
      document.getElementById('stepCounter').innerText = `ลำดับที่: ${currentIndex + 1} / ${playlist.length}`;

      speakText(item.th);
    }

    function nextMove() {
      currentIndex = (currentIndex + 1) % playlist.length;
      renderCurrentStep();
    }

    function toggleTraining() {
      const btn = document.getElementById('btnToggle');
      if (isRunning) {
        clearInterval(timer);
        timer = null;
        isRunning = false;
        btn.innerText = "ฝึกต่อ (Resume)";
        btn.style.backgroundColor = "#16a34a";
        btn.style.borderColor = "#22c55e";
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      } else {
        isRunning = true;
        btn.innerText = "หยุดชั่วคราว (Pause)";
        btn.style.backgroundColor = "#dc2626";
        btn.style.borderColor = "#ef4444";
        nextMove();
        timer = setInterval(nextMove, stepDelay);
      }
    }

    function resetTraining() {
      if (timer) clearInterval(timer);
      timer = null;
      isRunning = false;
      currentIndex = -1;
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();

      document.getElementById('btnToggle').innerText = "เริ่มการฝึก (Start)";
      document.getElementById('btnToggle').style.backgroundColor = "#dc2626";
      document.getElementById('btnToggle').style.borderColor = "#ef4444";
      document.getElementById('thaiDisplay').innerText = "พร้อมฝึกซ้อม";
      document.getElementById('phoneticDisplay').innerText = "READY";
      document.getElementById('englishDisplay').innerText = "Press Start to Begin";
      document.getElementById('stepCounter').innerText = `ลำดับที่: 0 / ${playlist.length}`;
    }

    function updateInterval() {
      stepDelay = parseInt(document.getElementById('intervalSelect').value, 10);
      if (isRunning) {
        clearInterval(timer);
        timer = setInterval(nextMove, stepDelay);
      }
    }

    // โหลด Voice list ล่วงหน้าสำหรับเบราว์เซอร์ Chrome/Safari
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
