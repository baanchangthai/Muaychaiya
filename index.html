<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบสั่งคำสั่งซ้อมมวย (Muay Drill Caller)</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #FFFFFF;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: #1E1E1E;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
      color: #FFB703;
    }
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      font-family: monospace;
      color: #00E676;
      margin: 10px 0;
    }
    .command-display {
      font-size: 2.2rem;
      font-weight: bold;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FF5722;
      background: #2A2A2A;
      border-radius: 12px;
      margin: 15px 0;
      padding: 10px;
    }
    .controls {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      gap: 10px;
    }
    .controls div {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 0.9rem;
    }
    select, input[type="number"] {
      background: #333;
      color: #FFF;
      border: 1px solid #555;
      padding: 8px;
      border-radius: 8px;
      margin-top: 5px;
      font-size: 1rem;
      text-align: center;
    }
    .technique-list {
      text-align: left;
      background: #2A2A2A;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      max-height: 180px;
      overflow-y: auto;
    }
    .technique-item {
      margin: 8px 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
    }
    .technique-item input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
    }
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.2rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 8px;
    }
    .btn-start {
      background-color: #00E676;
      color: #121212;
    }
    .btn-stop {
      background-color: #E53935;
      color: #FFFFFF;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🥊 ซ้อมมวยไชยา (Drill Caller)</h1>

  <div class="timer-display" id="timer">03:00</div>
  <div class="command-display" id="commandBox">พร้อมซ้อม</div>

  <div class="controls">
    <div>
      <label>เวลายก (นาที)</label>
      <input type="number" id="roundTime" value="3" min="1" max="10">
    </div>
    <div>
      <label>ช่วงเวลาสั่ง (วินาที)</label>
      <input type="number" id="intervalTime" value="3" min="1" max="10">
    </div>
  </div>

  <div class="technique-list" id="techniqueList">
    <div class="technique-item"><label><input type="checkbox" value="หมัดตรง" checked> หมัดตรง</label></div>
    <div class="technique-item"><label><input type="checkbox" value="หมัดฮุก" checked> หมัดฮุก</label></div>
    <div class="technique-item"><label><input type="checkbox" value="หมัดสอยดาว" checked> หมัดสอยดาว</label></div>
    <div class="technique-item"><label><input type="checkbox" value="เตะตัด" checked> เตะตัด</label></div>
    <div class="technique-item"><label><input type="checkbox" value="ถีบ" checked> ถีบ</label></div>
    <div class="technique-item"><label><input type="checkbox" value="ศอกตัด" checked> ศอกตัด</label></div>
    <div class="technique-item"><label><input type="checkbox" value="ศอกพุ่ง" checked> ศอกพุ่ง</label></div>
    <div class="technique-item"><label><input type="checkbox" value="เข่าตรง" checked> เข่าตรง</label></div>
    <div class="technique-item"><label><input type="checkbox" value="บังหมัด" checked> บังหมัด</label></div>
    <div class="technique-item"><label><input type="checkbox" value="หลบฉาก" checked> หลบฉาก</label></div>
  </div>

  <button class="btn btn-start" id="startBtn" onclick="startDrill()">เริ่มซ้อม</button>
  <button class="btn btn-stop" id="stopBtn" onclick="stopDrill()" style="display:none;">หยุด</button>
</div>

<script>
  let timerInterval = null;
  let commandInterval = null;
  let remainingSeconds = 0;
  let isRunning = false;

  // โหลดเสียงของระบบเตรียมไว้
  let systemVoices = [];
  function loadVoices() {
    if ('speechSynthesis' in window) {
      systemVoices = window.speechSynthesis.getVoices();
    }
  }
  if ('speechSynthesis' in window) {
    loadVoices();
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // ฟังก์ชันเล่นเสียงพูดที่แก้ปัญหาระบบเสียงของ iPad / Safari
  function playCommand(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'th-TH';
      utterance.rate = 1.1; // ความเร็วพอดีกับการซ้อมมวย

      // ค้นหาเสียงภาษาไทย
      if (!systemVoices.length) {
        systemVoices = window.speechSynthesis.getVoices();
      }
      const thVoice = systemVoices.find(v => v.lang.includes('th') || v.lang.includes('TH'));
      if (thVoice) {
        utterance.voice = thVoice;
      }

      window.speechSynthesis.speak(utterance);
    }
  }

  function triggerNextCommand() {
    const checkboxes = document.querySelectorAll('#techniqueList input[type="checkbox"]:checked');
    const selectedTechniques = Array.from(checkboxes).map(cb => cb.value);

    if (selectedTechniques.length === 0) return;

    const randomIndex = Math.floor(Math.random() * selectedTechniques.length);
    const command = selectedTechniques[randomIndex];

    document.getElementById('commandBox').innerText = command;
    playCommand(command);
  }

  function startDrill() {
    if (isRunning) return;

    // ปลดล็อกระบบเสียงสำหรับ Safari iOS (สำคัญมาก ต้องสั่งทันทีที่นิ้วสัมผัส)
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const unlock = new SpeechSynthesisUtterance('');
      unlock.lang = 'th-TH';
      window.speechSynthesis.speak(unlock);
    }

    const roundMinutes = parseInt(document.getElementById('roundTime').value) || 3;
    const intervalSec = parseInt(document.getElementById('intervalTime').value) || 3;

    remainingSeconds = roundMinutes * 60;
    isRunning = true;

    document.getElementById('startBtn').style.display = 'none';
    document.getElementById('stopBtn').style.display = 'block';

    document.getElementById('commandBox').innerText = "เริ่มชก!";
    playCommand("เริ่มชก");
    updateTimerDisplay();

    // เริ่มออกคำสั่งแรกหลังจากเริ่ม 1 วินาที
    setTimeout(() => {
      if (isRunning) triggerNextCommand();
    }, 1200);

    // ตัวจับเวลานับถอยหลัง
    timerInterval = setInterval(() => {
      remainingSeconds--;
      updateTimerDisplay();

      if (remainingSeconds <= 0) {
        endRound();
      }
    }, 1000);

    // ตัวลูปสุ่มคำสั่งท่าชก
    commandInterval = setInterval(() => {
      if (remainingSeconds > 0 && isRunning) {
        triggerNextCommand();
      }
    }, intervalSec * 1000);
  }

  function endRound() {
    stopDrill();
    document.getElementById('commandBox').innerText = "หมดเวลา!";
    playCommand("หมดเวลา");
  }

  function stopDrill() {
    clearInterval(timerInterval);
    clearInterval(commandInterval);
    isRunning = false;

    document.getElementById('startBtn').style.display = 'block';
    document.getElementById('stopBtn').style.display = 'none';

    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  function updateTimerDisplay() {
    const mins = Math.floor(remainingSeconds / 60);
    const secs = remainingSeconds % 60;
    document.getElementById('timer').innerText = 
      `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }
</script>
</body>
</html>
